name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8

      - name: black --check
        run: black --check .

      - name: pip-audit (dependency vulnerability scan)
        # Blocking, same as flake8/black above - a known CVE in a pinned
        # dependency is worth stopping deploy over until it's reviewed and
        # patched, not just reported after the fact. Dependabot (see
        # .github/dependabot.yml) is the other half of this: it opens the
        # PR that bumps the pinned version; this is what actually enforces
        # you don't ship past it in the meantime.
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_client_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      # DEBUG=True here on purpose: DEBUG=False flips on SECURE_SSL_REDIRECT
      # (see config/settings.py), which would 301-redirect every plain-HTTP
      # request the Django test client makes and break the whole suite.
      # That production-only hardening is exercised by deploying behind
      # Nginx/Cloudflare, not by this test run.
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_client_portal_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      # DIAGNOSTICS ONLY, and only after the step above has already failed: re-runs the suite
      # and publishes each failing test's name and assertion as an annotation, which is public
      # on the checks API (the raw job log needs authentication). It never decides pass/fail -
      # the "Run tests" exit code above already did, and this step cannot change the outcome.
      - name: Failure diagnostics (re-run, annotations only)
        if: failure()
        continue-on-error: true
        run: |
          set +e
          python manage.py test --noinput > test-rerun.log 2>&1
          python deployment/ci_annotate_failures.py < test-rerun.log

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Pinned to the v1.2.5 tag's commit SHA (not a mutable tag) - standard
      # practice for third-party actions that get SSH credentials.
      - name: Deploy over SSH (pull, rebuild, migrate, collectstatic)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ai-client-portal
            # Best-effort, never blocks the deploy: dumps the CURRENT (pre-
            # deploy) database via the existing web container before any new
            # code/migrations land, using accounts/management/commands/
            # backup_database.py (pg_dump + S3 upload, same command the daily
            # scheduled backup would use). No-ops loudly (not silently) via
            # deploy.log if BACKUP_S3_BUCKET isn't configured yet - see
            # docs/BACKUP_RESTORE.md - rather than ever failing the deploy
            # over a backup that was never set up.
            docker compose exec -T web python manage.py backup_database || echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) WARNING: pre-deploy backup skipped/failed" >> ~/ai-client-portal/deploy.log
            git rev-parse HEAD > /tmp/ai_client_portal_prev_sha
            git pull origin main
            # migrate + collectstatic are NOT run here — docker-entrypoint.sh
            # already runs both as part of the "web" container's own startup,
            # before gunicorn binds. Running them again here raced that same
            # entrypoint process on Postgres whenever a push had a genuinely
            # new migration to apply (harmless as a no-op otherwise, which is
            # why this looked intermittent) — root-caused after two
            # consecutive automated deploy failures whose steps both
            # reproduced cleanly by hand, one command at a time, right after
            # the rollback.
            # RELEASE_SHA is passed through docker-compose.yml to web, worker and beat, so
            # the post-deploy verification below can confirm every process runs THIS commit
            # (a green git pull says nothing about which image is actually running).
            RELEASE_SHA="$(git rev-parse HEAD)" docker compose up -d --build
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) deployed $(git rev-parse HEAD)" >> ~/ai-client-portal/deploy.log

      # Real client's-eye-view check, not just "did the SSH commands exit 0" -
      # a deploy that runs cleanly but ships a broken homepage still fails here.
      # Hits /healthz/ (config/urls.py) rather than /accounts/login/ - that
      # page used to pass this check as long as Gunicorn could render a
      # login form, even with the database completely unreachable (a
      # database-only outage wouldn't have failed a plain-page load, and
      # would have shipped/kept a broken deploy). /healthz/ actually runs a
      # SELECT 1 against the real database and 503s if that fails.
      # Retries with backoff instead of one fixed sleep+check: a full
      # container restart (stop old, start freshly-built new, Gunicorn boot)
      # took over 10s on this VM in practice and tripped a false-positive
      # rollback on the very first real deploy - polling for up to ~50s
      # succeeds as soon as it's actually ready instead of guessing one delay.
      - name: Health check (polls with backoff, up to ~50s)
        id: health_check
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${{ secrets.SSH_HOST }}/healthz/" || echo "000")
            echo "Attempt $i: status $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 7
          done
          echo "::error::Health check failed after 8 attempts - last status was $status"
          exit 1

      # Only reached if the health check above actually passed (default
      # `if:` behavior - no `if:` means "only if every previous step
      # succeeded"). Emails every active SuperAdmin so a passing deploy
      # doesn't need a manual GitHub Actions check - see
      # notifications/management/commands/send_deploy_notification.py.
      # `|| true` in the script keeps a flaky send from ever turning a
      # real, successful deploy into a failed CI run.
      - name: Notify SuperAdmins of successful deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            cd ~/ai-client-portal
            docker compose exec -T web python manage.py send_deploy_notification --status success --sha "${{ github.sha }}" || true

      # Informational smoke test from the runner's side (never a gate: a transient
      # Redis blip during a deploy must not roll back good code). Prints a real
      # request's status for the pages a visitor hits first; the health check above
      # is the gate. Exit codes are what decide pass/fail - no log-string matching.
      - name: Smoke test (informational)
        continue-on-error: true
        run: |
          host="${{ secrets.SSH_HOST }}"
          for path in /healthz/ /healthz/deep/ /accounts/login/; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "http://$host$path" || echo "000")
            echo "::notice title=smoke $path::HTTP $status"
            case "$status" in 200|301|302) ;; *) echo "::warning title=smoke $path::unexpected HTTP $status"; failed=1 ;; esac
          done
          [ -z "$failed" ]

      # READ-ONLY, informational (continue-on-error, and ops_verify itself always exits 0
      # unless --strict): confirms web/worker/beat run this exact commit, and reports
      # migrations, schema, Redis, Celery, news-feed reachability from the server, disk,
      # database connections and retention counts as annotations on this run. It writes
      # nothing (see governance/management/commands/ops_verify.py and its tests) and
      # prints no credentials. Being informational it can never trigger the rollback below.
      - name: Post-deploy verification (read-only, informational)
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 4m
          script: |
            cd ~/ai-client-portal
            expected="${{ github.sha }}"
            for svc in web worker beat; do
              running=$(docker compose exec -T "$svc" printenv RELEASE_SHA 2>/dev/null || echo unreachable)
              if [ "$running" = "$expected" ]; then
                echo "::notice title=release $svc::$svc runs $expected"
              else
                echo "::error title=release $svc::$svc runs $running but this deploy was $expected"
              fi
            done
            docker compose ps --format '{{.Service}} state={{.State}} health={{.Health}}' | while read -r line; do echo "::notice title=container::$line"; done
            docker system df --format '{{.Type}}: {{.Size}}, reclaimable {{.Reclaimable}}' | while read -r line; do echo "::notice title=docker disk::$line"; done
            docker compose exec -T web python manage.py ops_verify --annotate || true

      # Only runs if something above failed. Reverts the CODE to whatever was
      # deployed before this run and rebuilds - see the note in the PR/commit
      # this shipped with: this does NOT undo a database migration that
      # already ran, so it's a real safety net for bad application code
      # (syntax errors, import failures, a broken view) but not a complete
      # guarantee against a migration the old code can't handle.
      - name: Roll back to previous commit on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ai-client-portal
            if [ ! -f /tmp/ai_client_portal_prev_sha ]; then
              echo "No previous commit recorded - cannot auto-rollback."
              exit 1
            fi
            PREV_SHA=$(cat /tmp/ai_client_portal_prev_sha)
            echo "Rolling back to $PREV_SHA"
            git reset --hard "$PREV_SHA"
            RELEASE_SHA="$PREV_SHA" docker compose up -d --build
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ROLLED BACK to $PREV_SHA after failed deploy/health check" >> ~/ai-client-portal/deploy.log
            # Best-effort - the rollback itself already happened above and
            # must never be masked by a notification hiccup.
            docker compose exec -T web python manage.py send_deploy_notification --status failure --sha "${{ github.sha }}" --prev-sha "$PREV_SHA" || true
