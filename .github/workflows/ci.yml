name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8

      - name: black --check
        run: black --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_client_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      # DEBUG=True here on purpose: DEBUG=False flips on SECURE_SSL_REDIRECT
      # (see config/settings.py), which would 301-redirect every plain-HTTP
      # request the Django test client makes and break the whole suite.
      # That production-only hardening is exercised by deploying behind
      # Nginx/Cloudflare, not by this test run.
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_client_portal_test
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Pinned to the v1.2.5 tag's commit SHA (not a mutable tag) - standard
      # practice for third-party actions that get SSH credentials.
      - name: Deploy over SSH (pull, rebuild, migrate, collectstatic)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ai-client-portal
            git rev-parse HEAD > /tmp/ai_client_portal_prev_sha
            git pull origin main
            # migrate + collectstatic are NOT run here — docker-entrypoint.sh
            # already runs both as part of the "web" container's own startup,
            # before gunicorn binds. Running them again here raced that same
            # entrypoint process on Postgres whenever a push had a genuinely
            # new migration to apply (harmless as a no-op otherwise, which is
            # why this looked intermittent) — root-caused after two
            # consecutive automated deploy failures whose steps both
            # reproduced cleanly by hand, one command at a time, right after
            # the rollback.
            docker compose up -d --build
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) deployed $(git rev-parse HEAD)" >> ~/ai-client-portal/deploy.log

      # Real client's-eye-view check, not just "did the SSH commands exit 0" -
      # a deploy that runs cleanly but ships a broken homepage still fails here.
      # Retries with backoff instead of one fixed sleep+check: a full
      # container restart (stop old, start freshly-built new, Gunicorn boot)
      # took over 10s on this VM in practice and tripped a false-positive
      # rollback on the very first real deploy - polling for up to ~50s
      # succeeds as soon as it's actually ready instead of guessing one delay.
      - name: Health check (polls with backoff, up to ~50s)
        id: health_check
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${{ secrets.SSH_HOST }}/accounts/login/" || echo "000")
            echo "Attempt $i: status $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 7
          done
          echo "::error::Health check failed after 8 attempts - last status was $status"
          exit 1

      # Only runs if something above failed. Reverts the CODE to whatever was
      # deployed before this run and rebuilds - see the note in the PR/commit
      # this shipped with: this does NOT undo a database migration that
      # already ran, so it's a real safety net for bad application code
      # (syntax errors, import failures, a broken view) but not a complete
      # guarantee against a migration the old code can't handle.
      - name: Roll back to previous commit on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ai-client-portal
            if [ ! -f /tmp/ai_client_portal_prev_sha ]; then
              echo "No previous commit recorded - cannot auto-rollback."
              exit 1
            fi
            PREV_SHA=$(cat /tmp/ai_client_portal_prev_sha)
            echo "Rolling back to $PREV_SHA"
            git reset --hard "$PREV_SHA"
            docker compose up -d --build
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ROLLED BACK to $PREV_SHA after failed deploy/health check" >> ~/ai-client-portal/deploy.log
