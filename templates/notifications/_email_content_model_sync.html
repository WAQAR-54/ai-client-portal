{% load i18n %}
<span style="display:inline-block; padding:4px 10px; border-radius:999px; background:{{ accent_soft }}; color:{{ accent }}; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;">{{ notification.get_notification_type_display }}</span>
<h1 style="margin:14px 0 12px; font-size:20px; line-height:1.35; color:#12172b;">{{ notification.title }}</h1>
<p style="margin:0 0 14px; font-size:14px; line-height:1.6; color:#5b6472;">{{ notification.body }}</p>
{% if notification.metadata.preview %}
<div style="padding:12px 14px; border-radius:8px; background:#f5f7fa; border:1px solid #dde2ea; font-size:13px; color:#5b6472; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">{{ notification.metadata.preview }}</div>
{% endif %}
