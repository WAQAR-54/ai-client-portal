{% load i18n %}
<span style="display:inline-block; padding:4px 10px; border-radius:999px; background:{{ accent_soft }}; color:{{ accent }}; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;">{{ notification.get_notification_type_display }}</span>
<h1 style="margin:14px 0 12px; font-size:20px; line-height:1.35; color:#12172b;">{{ notification.title }}</h1>
<p style="margin:0 0 14px; font-size:14px; line-height:1.6; color:#5b6472;">{{ notification.body }}</p>
{% if notification.metadata.plan_name %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{ accent_soft }}; border-radius:8px;">
    <tr>
        <td style="padding:12px 14px;">
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:{{ accent }}; font-weight:700;">{% trans "New plan" %}</div>
            <div style="font-size:16px; font-weight:700; color:#12172b; margin-top:2px;">{{ notification.metadata.plan_name }}</div>
        </td>
    </tr>
</table>
{% endif %}
