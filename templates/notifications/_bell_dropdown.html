{% load i18n %}
<details class="notif-bell">
    <summary class="notif-bell-summary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        {% if unread_count %}<span class="notif-badge">{{ unread_count }}</span>{% endif %}
    </summary>
    <div class="notif-dropdown">
        <div class="notif-dropdown-header">
            <span>{% trans "Notifications" %}</span>
            {% if unread_count %}
            <form method="post" action="{% url 'notifications:mark_all_read' %}" hx-post="{% url 'notifications:mark_all_read' %}" hx-target="closest .notif-bell" hx-swap="outerHTML">
                {% csrf_token %}
                <button type="submit" class="link-btn" style="font-size:0.78rem; width:auto; padding:0;">{% trans "Mark all read" %}</button>
            </form>
            {% endif %}
        </div>
        <div class="notif-list">
            {% for n in notifications %}
            <form method="post" action="{% url 'notifications:mark_read' notification_id=n.id %}" hx-post="{% url 'notifications:mark_read' notification_id=n.id %}" hx-target="closest .notif-bell" hx-swap="outerHTML">
                {% csrf_token %}
                <button type="submit" class="notif-item{% if not n.is_read %} notif-item-unread{% endif %}">
                    <span class="notif-item-title">{{ n.title }}</span>
                    {% if n.body %}<span class="notif-item-body">{{ n.body|truncatechars:90 }}</span>{% endif %}
                    <span class="notif-item-time mono">{{ n.created_at|date:"M d, H:i" }}</span>
                </button>
            </form>
            {% empty %}
            <p class="notif-empty">{% trans "No notifications yet." %}</p>
            {% endfor %}
        </div>
    </div>
</details>
