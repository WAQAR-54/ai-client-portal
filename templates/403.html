{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Access denied" %} — {{ site_branding.site_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px; margin:10vh auto; text-align:center;">
    <div class="empty-icon-badge" style="width:48px; height:48px; margin:0 auto 1rem; background:var(--color-danger-soft); color:var(--color-danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 style="margin-bottom:0.4rem;">{% trans "Access denied" %}</h1>
    <p class="text-muted">{% trans "You don't have permission to view that page." %}</p>
    <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn mt-3" style="text-decoration:none; display:inline-block;">
        {% trans "Back to safety" %}
    </a>
</div>
{% endblock %}
