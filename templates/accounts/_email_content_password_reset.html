{% load i18n %}
<span style="display:inline-block; padding:4px 10px; border-radius:999px; background:{{ accent_soft }}; color:{{ accent }}; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;">{% trans "Password reset" %}</span>
<h1 style="margin:14px 0 12px; font-size:20px; line-height:1.35; color:#12172b;">{% trans "Reset your password" %}</h1>
<p style="margin:0; font-size:14px; line-height:1.6; color:#5b6472;">{% blocktrans with email=user.email %}We received a request to reset the password for {{ email }}. Click the button below to choose a new one. This link can only be used once.{% endblocktrans %}</p>
