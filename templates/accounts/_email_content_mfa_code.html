{% load i18n %}
<span style="display:inline-block; padding:4px 10px; border-radius:999px; background:{{ accent_soft }}; color:{{ accent }}; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;">{% trans "Verification code" %}</span>
<h1 style="margin:14px 0 12px; font-size:20px; line-height:1.35; color:#12172b;">{% trans "Your login verification code" %}</h1>
<p style="margin:0 0 20px; font-size:14px; line-height:1.6; color:#5b6472;">{% blocktrans %}Enter this code to finish signing in. It expires in {{ expiry_minutes }} minutes.{% endblocktrans %}</p>
<div style="text-align:center; padding:18px 0; background:#f5f7fa; border-radius:8px; font-family:'Courier New',monospace; font-size:32px; font-weight:700; letter-spacing:0.3em; color:#12172b;">{{ code }}</div>
