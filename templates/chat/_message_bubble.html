<div class="msg-row msg-{{ message.role }}">{% if message.role == "assistant" %}<div class="msg-avatar msg-avatar-assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg></div>{% endif %}<div class="msg-bubble">{% if message.content %}<span class="msg-text">{{ message.content }}</span>{% endif %}{% if message.attachment %}<a class="msg-attachment" href="{% url 'chat:download_attachment' conversation_id=message.conversation_id message_id=message.id %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>{{ message.attachment_original_name }}</a>{% endif %}</div>{% if message.role == "user" %}<div class="msg-avatar msg-avatar-user">{{ user.email|first|upper }}</div>{% endif %}</div>
