{% load i18n %}{% for label, items in grouped_conversations %}{% if not forloop.first or not continues_previous_bucket %}
<div class="chat-sidebar-label">{{ label }}</div>
{% endif %}
<ul class="conv-group">
    {% for c in items %}{% include "chat/_conversation_item.html" with c=c %}{% endfor %}
</ul>
{% endfor %}{% if has_more_conversations %}
<button type="button" class="sidebar-load-more-btn"
        hx-get="{{ load_more_url }}" hx-target="this" hx-swap="outerHTML"
        hx-on::after-swap="window.portalApplyConversationFilter && window.portalApplyConversationFilter()">
    {% trans "Load more" %}
</button>
{% endif %}
