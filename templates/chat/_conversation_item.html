{% load i18n governance_extras %}
<li class="conv-item{% if c.is_pinned %} conv-item-pinned{% endif %}">
    <a href="{% url 'chat:chat_conversation' conversation_id=c.id %}"
       class="conv-item-link{% if c.id == active_conversation_id %} active{% endif %}">
        {% if c.is_pinned %}<span class="pin-dot" title="{% trans 'Pinned' %}"></span>{% endif %}
        <span>{{ c.title }}</span>
    </a>
    <div class="conv-item-actions">
        {% if request.user|has_feature:"conversation_pin_search" %}
        <form method="post" action="{% url 'chat:toggle_pin' conversation_id=c.id %}"
              hx-post="{% url 'chat:toggle_pin' conversation_id=c.id %}"
              hx-target="#conv-list-container" hx-swap="outerHTML"
              hx-indicator="#conv-list-skeleton">
            {% csrf_token %}
            <button type="submit" class="conv-action-btn{% if c.is_pinned %} conv-action-active{% endif %}"
                    title="{% if c.is_pinned %}{% trans 'Unpin conversation' %}{% else %}{% trans 'Pin conversation' %}{% endif %}">
                <svg viewBox="0 0 24 24" fill="{% if c.is_pinned %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
            </button>
        </form>
        {% endif %}
        <form method="post" action="{% url 'chat:delete_conversation' conversation_id=c.id %}"
              hx-post="{% url 'chat:delete_conversation' conversation_id=c.id %}"
              hx-confirm="{% trans 'Delete this conversation? This cannot be undone.' %}"
              hx-target="#conv-list-container" hx-swap="outerHTML"
              hx-indicator="#conv-list-skeleton">
            {% csrf_token %}
            <button type="submit" class="conv-action-btn conv-action-danger" title="{% trans 'Delete conversation' %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
        </form>
    </div>
</li>
