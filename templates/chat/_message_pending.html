{% include "chat/_message_bubble.html" with message=user_message %}
<div hx-ext="sse"
     sse-connect="{% url 'chat:stream_message' conversation_id=conversation.id message_id=pending_message.id %}{% if model_id %}?model_id={{ model_id }}{% endif %}"
     class="msg-row msg-assistant">
    <div class="msg-avatar msg-avatar-assistant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
    </div>
    <div class="msg-content msg-content-pending" sse-swap="message" hx-swap="beforeend"></div>
    <div sse-swap="error" hx-swap="innerHTML" class="msg-error-text"></div>
    <span sse-swap="done" hx-swap="delete" hx-target="this"></span>
</div>
