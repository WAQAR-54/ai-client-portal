{% for cap in capabilities %}
<div class="plan-capability-row" style="display:flex; align-items:flex-start; gap:0.5rem; padding:0.3rem 0; font-size:0.82rem;">
    {% if cap.included %}
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-success); flex-shrink:0; margin-top:0.15rem;"><polyline points="20 6 9 17 4 12"/></svg>
    <span>{{ cap.label }} <span class="text-faint">— {{ cap.value }}</span></span>
    {% else %}
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="color:var(--color-text-faint); flex-shrink:0; margin-top:0.15rem;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    <span class="text-faint">{{ cap.label }}</span>
    {% endif %}
</div>
{% endfor %}
