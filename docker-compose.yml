# Full local stack: Django (Gunicorn), PostgreSQL, Redis, Celery worker, Celery beat.
#
# All four app services (web/worker/beat) build from the same image and read
# secrets (SECRET_KEY, FIELD_ENCRYPTION_KEY, SENTRY_DSN, etc.) from the
# project's own .env file via env_file: - the same file used for native
# (non-Docker) local dev. DATABASE_URL/REDIS_URL are overridden below to
# point at the bundled db/redis containers instead of whatever .env has for
# native dev. AI provider API keys are NOT here - they're connected from
# Admin -> Providers and stored encrypted in the database.
#
# Quick start from a clean checkout:
#   docker-compose up -d --build
#   docker-compose exec web python manage.py createsuperuser
# See README.md for the full walkthrough.

# Container stdout/stderr is kept by Docker with NO size limit by default, and the
# app's console log handler writes every INFO line there - so a busy month could
# fill the disk. Rotate: at most 3 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_client_portal}
      POSTGRES_USER: ${POSTGRES_USER:-ai_client_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_client_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_client_portal}:${POSTGRES_PASSWORD:-changeme-local-only}@db:5432/${POSTGRES_DB:-ai_client_portal}
      REDIS_URL: redis://redis:6379/0
      # Gunicorn defaults to binding 127.0.0.1 (safe when Nginx sits in
      # front of it on a bare VPS) - inside Docker that would make the
      # container unreachable via the port mapping below, so bind all
      # interfaces here instead.
      GUNICORN_BIND: 0.0.0.0:8000
      # Fails CLOSED (secure) if the server's own .env doesn't set DEBUG at
      # all - e.g. bootstrapped by copying .env.example (which ships
      # DEBUG=True for local dev) without editing this one line. A default
      # of True here would silently run production with full tracebacks
      # (SQL, file paths, potentially secrets) exposed to any visitor who
      # triggers a 500 - never worth risking for the local-dev convenience
      # of not having to set DEBUG=True explicitly there.
      DEBUG: ${DEBUG:-False}
      # This compose file is only ever used for the real deployed stack
      # (see the file-level comment above) - config/settings.py's
      # DEBUG=True-in-production startup guard reads this, so it defaults
      # to "production" here specifically, the opposite of local dev's
      # bare `manage.py runserver` (which never sets it and stays
      # "development").
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # The git commit this stack was built from (set by the deploy step). Lets
      # `manage.py ops_verify` and System status confirm that web, worker and beat
      # are all running the intended revision, not just that Git is current.
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      # Transport security for a site whose visitors reach it through Cloudflare (which terminates TLS and
      # speaks plain HTTP to this origin). Each can be overridden from the server's .env; setting the first
      # to False is the kill switch if the redirect ever misbehaves. See accounts/middleware.py and
      # docs/OPERATIONS.md ("Transport security").
      #   ENFORCE_HTTPS_VIA_CLOUDFLARE  redirect visitors who used http:// (per Cloudflare's CF-Visitor)
      #   CLOUDFLARE_HSTS_SECONDS       Strict-Transport-Security max-age; starts at 1 day on purpose
      #   *_COOKIE_SECURE               the browser then never sends the session/CSRF cookie over http://
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      ENFORCE_HTTPS_VIA_CLOUDFLARE: ${ENFORCE_HTTPS_VIA_CLOUDFLARE:-True}
      CLOUDFLARE_HSTS_SECONDS: ${CLOUDFLARE_HSTS_SECONDS:-86400}
    logging: *default-logging
    ports:
      # 0.0.0.0 keeps today's behaviour: Gunicorn is reachable on the host's public address, so anyone who
      # finds the origin can skip Cloudflare. Once Nginx on this host is confirmed to proxy to
      # 127.0.0.1:8000 (deployment/nginx.conf.example), set WEB_BIND_ADDRESS=127.0.0.1 in the server's .env
      # to close that door. The default is unchanged because the live Nginx config is not in this repository.
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "deployment/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_client_portal}:${POSTGRES_PASSWORD:-changeme-local-only}@db:5432/${POSTGRES_DB:-ai_client_portal}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    logging: *default-logging
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # celery inspect ping round-trips through the real broker (Redis) to
      # THIS worker process and back - proves it's actually consuming
      # tasks, not just that the container's PID 1 hasn't exited (which
      # restart: unless-stopped already covers on its own; this catches
      # the worker being alive but stuck/hung/lost its broker connection).
      # Before this, a hung worker had no way to be detected short of
      # noticing invoices/emails/backups had silently stopped processing.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    build: .
    command: beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_client_portal}:${POSTGRES_PASSWORD:-changeme-local-only}@db:5432/${POSTGRES_DB:-ai_client_portal}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
